services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: file:/app/data/pulse.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
    volumes:
      - pulse-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # docker compose --profile seed run --rm seed
  # Run it after `app` has started once, so the volume already belongs to uid 1001.
  seed:
    build:
      context: .
      target: build
    profiles: [seed]
    user: '1001:1001'
    environment:
      DATABASE_URL: file:/app/data/pulse.db
    volumes:
      - pulse-data:/app/data
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed"

volumes:
  pulse-data:
